services:
  - type: web
    name: iris2work
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /api/state
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
